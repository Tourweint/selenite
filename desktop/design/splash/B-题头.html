<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Selenite · 启动</title>
<style>
/* ── 方案 B「题头」────────────────────────────────────────
   主张：不要图形，只要一张纸和一行字。
   理由：启动页停留时间以秒计，越少元素越不像「卡住了」；
   而且它天然跟纸感主题同色同字，切换进业务页时几乎没有跳变。
   纸上有极细的颗粒（feTurbulence），近看才有——远看只是「不像屏幕的白」。
   ---------------------------------------------------------------- */
:root {
  color-scheme: light;
  --bg: #fdf9f2;
  --backdrop: #f1ebe0;
  --text: #2e2b3a;
  --text-2: #6e6b7e;
  --text-3: #9a97a5;
  --primary: #3e4a8c;
  --secondary: #b89b6e;
  --serif: "Songti SC", "Noto Serif SC", "Source Han Serif SC", "STSong", "SimSun", "Microsoft YaHei", serif;
  --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
}
* { box-sizing: border-box; margin: 0; }
html, body { height: 100%; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--serif);
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
}
/* 纸的底：左上一点暖光，加一层几乎看不见的颗粒。 */
body::before {
  content: ""; position: fixed; inset: 0; pointer-events: none;
  background:
    radial-gradient(120% 90% at 18% 0%, rgba(255, 252, 244, .9), transparent 60%),
    radial-gradient(80% 70% at 100% 100%, rgba(232, 222, 205, .28), transparent 62%);
}
body::after {
  content: ""; position: fixed; inset: 0; pointer-events: none;
  opacity: .035;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/></filter><rect width='180' height='180' filter='url(%23n)' opacity='.55'/></svg>");
}

.bar {
  position: fixed; inset: 0 0 auto 0; height: 40px;
  display: flex; align-items: center;
  padding: 0 16px 0 14px;
  background: var(--backdrop);
  user-select: none;
  -webkit-app-region: drag;
}
.brand { font-size: 13px; font-weight: 600; }
.bar-hint { margin-left: auto; font-family: var(--mono); font-size: 11px; color: var(--text-3); }

.stage { position: fixed; inset: 40px 0 0; display: grid; place-items: center; padding: 24px; }

/* 整块左对齐、宽度收窄：左对齐的长短句读起来像题记，居中的像弹窗。 */
.lock { width: min(100%, 380px); }

/* 顶部那道铜色短线：整页唯一的「彩色」，只占 40px。 */
.tick { width: 40px; height: 2px; background: var(--secondary); opacity: .75; animation: ink .9s cubic-bezier(.2, .8, .2, 1) both; }

.kicker {
  margin-top: 18px;
  font-family: var(--mono); font-size: 10.5px; letter-spacing: .3em;
  color: var(--text-3); text-indent: .3em;
  animation: rise .6s .06s cubic-bezier(.2, .8, .2, 1) both;
}

.hero {
  margin-top: 14px;
  font-size: clamp(26px, 4.4vh + 8px, 40px);
  font-weight: 600; line-height: 1.3; letter-spacing: .02em;
  animation: rise .62s .1s cubic-bezier(.2, .8, .2, 1) both;
}

.status {
  margin-top: 20px;
  font-size: 14.5px; letter-spacing: .06em;
  color: var(--text);
  min-height: 1.6em;
  transition: opacity .2s ease;
  animation: rise .6s .22s cubic-bezier(.2, .8, .2, 1) both;
}
.status.dim { opacity: .2; }

/* 尺：一条 1px 墨线从 0 长到整幅，之后底下有一小段墨在慢慢来回——
   长出来了说明「已经在动」，来回走说明「还没好」，比转速表诚实。 */
.rule { position: relative; margin-top: 26px; height: 1px; background: rgba(46, 43, 58, .13); overflow: hidden; }
.rule .grow {
  position: absolute; inset: 0 auto 0 0; height: 1px; width: 100%;
  background: rgba(46, 43, 58, .38);
  transform-origin: left; transform: scaleX(0);
  animation: grow 1.1s .3s cubic-bezier(.2, .7, .2, 1) forwards;
}
.rule .run {
  position: absolute; top: 0; height: 1px; width: 22%;
  background: linear-gradient(90deg, transparent, var(--primary), transparent);
  opacity: 0; animation: run 2.6s 1.5s cubic-bezier(.45, 0, .45, 1) infinite;
}

.meta {
  margin-top: 16px; display: flex; align-items: baseline; gap: 12px;
  font-family: var(--mono); font-size: 11.5px; color: var(--text-3);
  font-variant-numeric: tabular-nums;
  animation: rise .6s .34s cubic-bezier(.2, .8, .2, 1) both;
}
.meta b { font-weight: 400; color: var(--text-2); }
.meta .dot { color: var(--text-3); opacity: .5; }

.slow {
  margin-top: 12px;
  font-size: 12.5px; line-height: 1.75; color: var(--text-2); max-width: 30em;
  opacity: 0; transform: translateY(-2px);
  transition: opacity .3s ease, transform .3s ease;
}
.slow.on { opacity: 1; transform: none; }

@keyframes ink  { from { transform: scaleX(0); transform-origin: left; } }
@keyframes grow { to { transform: scaleX(1); } }
@keyframes rise { from { opacity: 0; transform: translateY(6px); } }
@keyframes run  { 0% { left: -25%; opacity: 0; } 12% { opacity: .75; } 88% { opacity: .75; } 100% { left: 105%; opacity: 0; } }

@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; }
  .tick, .kicker, .hero, .status, .meta { animation: none; }
  .rule .grow { animation: none; transform: scaleX(1); }
  .rule .run { animation: none; opacity: .5; left: 38%; }
}
</style>
</head>
<body>
  <div class="bar">
    <span class="brand">Selenite</span>
    <span class="bar-hint" id="bar-hint">启动中</span>
  </div>

  <div class="stage">
    <div class="lock">
      <div class="tick"></div>
      <div class="kicker">LOCAL · 启动中</div>
      <h1 class="hero">这就起来。</h1>
      <p class="status" id="status">拉起 node 进程</p>
      <div class="rule"><span class="grow"></span><span class="run"></span></div>
      <div class="meta">
        <span id="meta">探测 <b>1</b> 次 · 已等 <b>0.0</b>s</span>
        <span class="dot">/</span>
        <span id="where">127.0.0.1</span>
      </div>
      <p class="slow" id="slow">第一次启动要先编译 TypeScript，慢一点是正常的。</p>
    </div>
  </div>

<script>
/* 同 A：预览用时间轴，真实实现由壳推 phase。 */
(function () {
  var pre = new URLSearchParams(location.search).get("state");
  var statusEl = document.getElementById("status");
  var metaEl = document.getElementById("meta");
  var slowEl = document.getElementById("slow");
  var barEl = document.getElementById("bar-hint");

  var PHASES = [
    { at: 0,   text: "拉起 node 进程" },
    { at: 2.4, text: "编译 tsx，等它起来" },
    { at: 5.2, text: "连本地库" },
    { at: 8.4, text: "校一遍服务状态" }
  ];
  var t0 = performance.now(), shown = "", step = 0;

  function say(text) {
    if (text === shown) return;
    shown = text;
    statusEl.classList.add("dim");
    setTimeout(function () { statusEl.textContent = text; statusEl.classList.remove("dim"); }, 200);
  }

  function tick() {
    var sec = (performance.now() - t0) / 1000;
    if (pre === "slow") sec += 9000;
    for (var i = PHASES.length - 1; i >= 0; i--) if (sec >= PHASES[i].at) { step = i; break; }
    if (sec < 9) say(PHASES[step].text);
    metaEl.innerHTML = "探测 <b>" + (1 + Math.floor(sec / 1.5)) + "</b> 次 · 已等 <b>" + sec.toFixed(1) + "</b>s";
    if (sec >= 9) { if (step < 3) say("再等一会儿"); slowEl.classList.add("on"); barEl.textContent = "较慢"; }
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
})();
</script>
</body>
</html>
