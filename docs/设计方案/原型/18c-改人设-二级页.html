<!doctype html>
<html lang="zh-CN" data-theme="paper">
<head>
<meta charset="utf-8">
<title>改人设 · C 二级页</title>
<style>
:root{
  --bg:#fdf9f2; --surface:#fdf9f2; --surface-low:#f7f3eb; --card:#f6f1e7; --card-high:#ede9e0;
  --text:#2e2b3a; --text-2:#6e6b7e; --text-3:#9a97a5;
  --outline:#c8c5bc; --divider:rgba(200,197,188,.55);
  --accent:#3e4a8c; --on-accent:#fff;
  --backdrop:#f1ebe0;
  --r-sm:8px; --r-md:12px; --r-lg:16px;
  --font:"Songti SC","Noto Serif SC","Source Han Serif SC","STSong","SimSun","Microsoft YaHei",serif;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
}
html[data-theme="indigo"]{
  --bg:#12141d; --surface:#161922; --surface-low:#181b26; --card:#191c27; --card-high:#212433;
  --text:#e7e9f2; --text-2:#a5a9ba; --text-3:#6d7183;
  --outline:#3a3f52; --divider:rgba(255,255,255,.09);
  --accent:#8b97ea; --on-accent:#101223;
  --backdrop:#0d0f16;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--backdrop);color:var(--text);font:14px/1.6 var(--font);-webkit-font-smoothing:antialiased;overflow:hidden}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
svg{display:block}

.app{position:fixed;inset:0;display:flex;background:var(--backdrop)}
.side{width:232px;flex:none;padding:20px 12px;display:flex;flex-direction:column;gap:2px}
.brand{font-size:13px;font-weight:600;padding:0 10px 14px;display:flex;align-items:center;gap:8px}
.brand i{width:14px;height:14px;border-radius:4px;background:var(--card-high);display:block}
.nav-h{font-size:11px;color:var(--text-3);letter-spacing:.16em;padding:6px 10px 8px}
.nav{display:flex;align-items:center;gap:10px;height:34px;padding:0 10px;border-radius:10px;font-size:12.5px;color:var(--text-2)}
.nav svg{width:15px;height:15px;opacity:.75}
.nav.on{background:var(--bg);color:var(--text);box-shadow:0 1px 2px rgba(46,43,58,.05)}

.main{flex:1;min-width:0;background:var(--bg);border-radius:16px 0 0 0;display:flex;flex-direction:column;overflow:hidden}
.scroll{flex:1;min-height:0;overflow-y:auto;padding:22px 40px 0}
.col{width:min(100%,760px)}

.crumb{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--text-3);margin-bottom:14px}
.crumb button{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--text-3);padding:3px 7px 3px 4px;border-radius:7px;margin-left:-4px}
.crumb button:hover{background:var(--card);color:var(--text-2)}
.crumb svg{width:13px;height:13px}

.thead{display:flex;align-items:center;gap:14px;margin-bottom:24px}
.ava-wrap{position:relative;flex:none}
.ava{width:64px;height:64px;border-radius:50%;background:var(--card-high);display:grid;place-content:center;font-size:20px;color:var(--text-2);border:1px solid transparent}
.ava:hover{border-color:rgba(62,74,140,.32)}
.badge{position:absolute;right:-3px;bottom:-3px;width:22px;height:22px;border-radius:50%;background:var(--bg);border:1px solid var(--outline);display:grid;place-content:center;color:var(--text-2)}
.badge svg{width:11px;height:11px}
.tmain{flex:1;min-width:0}
.title-in{width:100%;background:none;border:0;border-bottom:1px dashed transparent;font-size:22px;font-weight:600;line-height:1.35;padding:0 0 2px;color:var(--text)}
.title-in:hover{border-bottom-color:var(--outline)}
.title-in:focus{outline:0;border-bottom-color:var(--accent)}
.tsub{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--text-3);margin-top:5px}
.dot{width:5px;height:5px;border-radius:50%;background:#1f9d4d;display:block}
.tag{font-size:10.5px;color:var(--text-3);border:1px solid var(--divider);border-radius:var(--r-full);padding:1px 7px}

.sec-h{display:flex;align-items:baseline;justify-content:space-between;margin:0 0 8px}
.sec-t{font-size:12.5px;font-weight:600}
.sec-s{font-size:11.5px;color:var(--text-3)}

.card{background:var(--card);border:1px solid rgba(46,43,58,.07);border-radius:16px;padding:18px 20px}
.card.plain{background:transparent;border-color:var(--divider)}
.card textarea{width:100%;height:300px;resize:none;background:none;border:0;outline:0;
  font-size:14px;line-height:2.05;color:var(--text);letter-spacing:.01em}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.f{display:flex;flex-direction:column;gap:6px}
.f label{font-size:11px;color:var(--text-3)}
.f input{height:36px;padding:0 12px;background:var(--bg);border:1px solid var(--divider);border-radius:10px;font-size:13px;outline:0}
.f input.mono{font-family:var(--mono);font-size:12px}
.f input:focus{border-color:var(--accent)}
.f .note{font-size:11px;color:var(--text-3)}

.adv-card{margin-top:24px;border:1px solid var(--divider);border-radius:16px;overflow:hidden}
.adv-row{width:100%;display:flex;align-items:center;gap:10px;height:50px;padding:0 18px;font-size:12.5px;color:var(--text);text-align:left}
.adv-row+.adv-row{border-top:1px solid var(--divider)}
.adv-row:hover{background:var(--card)}
.adv-row .sum{margin-left:auto;font-size:11.5px;color:var(--text-3)}
.adv-row .sum.on{color:var(--text-2)}
.adv-row svg{width:14px;height:14px;color:var(--text-3)}

.foot{flex:none;border-top:1px solid var(--divider);background:var(--bg);padding:12px 40px 16px}
.foot-in{width:min(100%,760px);display:flex;align-items:center;gap:12px}
.state{display:flex;align-items:center;gap:7px;font-size:11.5px;color:var(--text-3)}
.state i{width:6px;height:6px;border-radius:50%;background:var(--outline)}
.state.dirty{color:var(--text-2)}
.state.dirty i{background:var(--accent)}
.state .msg{color:var(--text-3)}
.spacer{flex:1}
.btn-primary{height:32px;padding:0 16px;border-radius:var(--r-md);background:var(--accent);color:var(--on-accent);font-size:12.5px}
.ghost{height:32px;padding:0 14px;border:1px solid var(--outline);border-radius:var(--r-md);color:var(--text-2);font-size:12.5px}
.ghost[disabled]{color:var(--text-3);border-color:var(--divider)}
.ava img{width:100%;height:100%;object-fit:cover;border-radius:50%;display:block}
</style>
</head>

    <div class="brand"><i></i>Selenite</div>
    <div class="nav-h">设置</div>
    <div class="nav">外观</div><div class="nav">会话</div><div class="nav">项目</div><div class="nav">归档</div>
    <div class="nav">定时任务</div><div class="nav">连接</div><div class="nav">模型</div><div class="nav">服务</div>
    <div class="nav">用量</div><div class="nav">记忆</div><div class="nav on">人设</div><div class="nav">技能</div><div class="nav">关于</div>
  </aside>

          <textarea spellcheck="false" aria-label="人设正文">你是这个家的总管。谁问你什么，先给结论，再给理由；理由不超过两句。

说话用短句，少形容词。不确定就说不知道，别编；要猜就标出来是猜的。

派活之前先看对方手上有没有活。有就等，别催；没有就直接说清楚要什么。

遇到要动文件、跑命令、花钱的事，先说清要做什么，等主人点头。</textarea>
        </div>

          <div class="f"><label>名字</label><input value="总管"></div>
          <div class="f"><label>领域标签</label><input class="mono" value="" placeholder="例如 frontend，可留空"></div>
        </div></div>

        <div class="adv-card">
          <button class="adv-row"><span>备选模型</span><span class="sum">未配置</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m9 18 6-6-6-6"/></svg></button>
          <button class="adv-row"><span>例行任务</span><span class="sum on">1 条 · 每天 21:30 写日记</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m9 18 6-6-6-6"/></svg></button>
        </div>
        <div style="height:22px"></div>
      </div>
    </div>

    <div class="foot">
      <div class="foot-in">
        <div class="state dirty"><i></i>3 处改动未保存<span class="msg">· 保存后下一轮起用</span></div>
        <div class="spacer"></div>
        <button class="ghost">撤销改动</button>
        <button class="btn-primary">保存</button>
      </div>
    </div>
  </main>
</div>
