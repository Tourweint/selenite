<!doctype html>
<html lang="zh-CN" data-theme="paper">
<head>
<meta charset="utf-8">
<title>改人设 · A 档案</title>
<style>
/* 与 web/style-01-tokens.css 同一套纸白 token，只为原型自带一份 */
:root {
  --bg:#fdf9f2; --surface:#fdf9f2; --surface-low:#f7f3eb; --card:#f6f1e7; --card-high:#ede9e0;
  --text:#2e2b3a; --text-2:#6e6b7e; --text-3:#9a97a5;
  --outline:#c8c5bc; --divider:rgba(200,197,188,.55);
  --accent:#3e4a8c; --on-accent:#fff; --accent-soft:color-mix(in srgb,var(--accent) 13%,var(--bg));
  --accent-line:color-mix(in srgb,var(--accent) 32%,transparent);
  --backdrop:#f1ebe0; --modal-mask:rgba(0,0,0,.6);
  --shadow-menu:0 4px 16px rgba(46,43,58,.15);
  --r-sm:8px; --r-md:12px; --r-lg:16px; --r-xl:24px; --r-full:9999px;
  --font:"Songti SC","Noto Serif SC","Source Han Serif SC","STSong","SimSun","Microsoft YaHei",serif;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
}
html[data-theme="indigo"]{
  --bg:#12141d; --surface:#161922; --surface-low:#181b26; --card:#191c27; --card-high:#212433;
  --text:#e7e9f2; --text-2:#a5a9ba; --text-3:#6d7183;
  --outline:#3a3f52; --divider:rgba(255,255,255,.09);
  --accent:#8b97ea; --on-accent:#101223;
  --backdrop:#0d0f16; --modal-mask:rgba(0,0,0,.7);
  --shadow-menu:0 4px 16px rgba(0,0,0,.5);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--backdrop);color:var(--text);font:14px/1.6 var(--font);-webkit-font-smoothing:antialiased;overflow:hidden}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
svg{display:block}

/* ── 背景：真实应用的一层示意（侧栏 + 设置页人设列表）── */
.app{position:fixed;inset:0;display:flex;background:var(--backdrop)}
.side{width:232px;flex:none;padding:20px 12px;display:flex;flex-direction:column;gap:2px}
.brand{font-size:13px;font-weight:600;letter-spacing:.02em;padding:0 10px 14px;display:flex;align-items:center;gap:8px}
.brand i{width:14px;height:14px;border-radius:4px;background:var(--card-high);display:block}
.nav-h{font-size:11px;color:var(--text-3);letter-spacing:.16em;padding:6px 10px 8px}
.nav{display:flex;align-items:center;gap:10px;height:34px;padding:0 10px;border-radius:10px;font-size:12.5px;color:var(--text-2)}
.nav svg{width:15px;height:15px;opacity:.75}
.nav.on{background:var(--bg);color:var(--text);box-shadow:0 1px 2px rgba(46,43,58,.05)}
.main{flex:1;min-width:0;background:var(--bg);border-radius:16px 0 0 0;padding:24px 34px;overflow:hidden}
.main h1{font-size:17px;font-weight:600;margin:0 0 18px}
.lhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.lhead span{font-size:13px;font-weight:600}
.btn-primary{height:30px;padding:0 14px;border-radius:var(--r-md);background:var(--accent);color:var(--on-accent);font-size:12.5px;display:inline-flex;align-items:center;gap:6px}
.btn-primary svg{width:13px;height:13px}
.btn-primary[disabled]{opacity:.45}
.ghost{height:30px;padding:0 13px;border:1px solid var(--outline);border-radius:var(--r-md);color:var(--text-2);font-size:12.5px}
.ghost[disabled]{color:var(--text-3);border-color:var(--divider)}
.lcard{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:14px;padding:12px 16px;margin-bottom:8px}
.lava{width:36px;height:36px;border-radius:50%;background:var(--card-high);display:grid;place-content:center;font-size:13px;color:var(--text-2)}
.lmain{flex:1;min-width:0}
.lname{font-size:13px}
.lmeta{font-size:11px;color:var(--text-3);margin-top:2px}
.acts{display:flex;gap:6px}
.acts .ghost{height:26px;padding:0 10px;font-size:11.5px}

/* ── 遮罩 + 面板 ── */
.mask{position:fixed;inset:0;background:var(--modal-mask);backdrop-filter:blur(2px)}
.panel{
  position:fixed;left:50%;top:16px;transform:translateX(-50%);
  width:880px;height:700px;
  display:flex;flex-direction:column;
  background:var(--surface);
  border:1px solid var(--outline);
  border-radius:18px;
  box-shadow:0 24px 64px rgba(0,0,0,.30);
  overflow:hidden;
}
.head{flex:none;height:52px;display:flex;align-items:center;gap:10px;padding:0 18px 0 22px;border-bottom:1px solid var(--divider)}
.head h2{margin:0;font-size:14.5px;font-weight:600;letter-spacing:.01em}
.head .crumb{font-size:12px;color:var(--text-3)}
.head .x{margin-left:auto;width:26px;height:26px;display:grid;place-content:center;border-radius:8px;color:var(--text-3)}
.head .x:hover{background:var(--card);color:var(--text)}

.body{flex:1;min-height:0;display:grid;grid-template-columns:264px minmax(0,1fr)}

/* 左：这是谁 */
.idcol{border-right:1px solid var(--divider);padding:26px 20px;display:flex;flex-direction:column;min-height:0}
.who{display:flex;flex-direction:column;align-items:center;gap:12px}
.ava-wrap{position:relative;width:88px;height:88px}
.ava{width:88px;height:88px;border-radius:50%;background:var(--card-high);display:grid;place-content:center;font-size:26px;color:var(--text-2);border:1px solid transparent}
.ava:hover{border-color:var(--accent-line)}
.ava-badge{position:absolute;right:-2px;bottom:-2px;width:24px;height:24px;border-radius:50%;background:var(--surface);border:1px solid var(--outline);display:grid;place-content:center;color:var(--text-2)}
.ava-badge svg{width:12px;height:12px}
.name-in{width:100%;text-align:center;background:none;border:0;border-bottom:1px dashed transparent;font-size:18px;font-weight:600;padding:2px 0 3px;color:var(--text)}
.name-in:hover{border-bottom-color:var(--outline)}
.name-in:focus{outline:0;border-bottom-color:var(--accent)}
.domain-in{width:100%;text-align:center;background:none;border:0;font-family:var(--mono);font-size:11.5px;color:var(--text-3);padding:0}
.domain-in:focus{outline:0;color:var(--text-2)}

.facts{margin-top:26px;display:flex;flex-direction:column;gap:0}
.fact{display:flex;align-items:baseline;justify-content:space-between;padding:9px 0;border-top:1px solid var(--divider)}
.fact span:first-child{font-size:11px;color:var(--text-3)}
.fact span:last-child{font-size:11.5px;color:var(--text-2);font-variant-numeric:tabular-nums}
.fact .ok{color:var(--ok, #1f9d4d)}

.adv{margin-top:30px;padding-top:16px;border-top:1px solid var(--divider)}
.adv-h{font-size:10.5px;letter-spacing:.14em;color:var(--text-3);margin-bottom:6px}
.adv-row{width:100%;display:flex;align-items:center;gap:8px;height:38px;padding:0 8px;margin:0 -8px;border-radius:9px;font-size:12.5px;color:var(--text-2);text-align:left;width:calc(100% + 16px)}
.adv-row:hover{background:var(--card)}
.adv-row .dot{width:5px;height:5px;border-radius:50%;background:var(--outline);display:block;flex:none}
.adv-row .dot.on{background:var(--accent)}
.adv-row b{font-weight:400;color:var(--text);flex:1}
.adv-row em{font-style:normal;font-size:11px;color:var(--text-3)}
.adv-row svg{width:13px;height:13px;color:var(--text-3)}

/* 右：它怎么说话 */
.doc{padding:22px 26px 0;display:flex;flex-direction:column;min-height:0}
.doc-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.doc-title{font-size:13px;font-weight:600}
.doc-sub{font-size:11.5px;color:var(--text-3);margin-top:3px}
.doc-count{font-family:var(--mono);font-size:11px;color:var(--text-3);font-variant-numeric:tabular-nums}
.sheet{
  flex:1;min-height:0;margin-top:12px;
  background:var(--card);
  border:1px solid var(--card-border, rgba(46,43,58,.07));
  border-radius:14px;
  padding:20px 22px;
  display:flex;
}
.sheet textarea{
  width:100%;height:100%;min-height:0;resize:none;
  background:none;border:0;outline:0;
  font-size:14px;line-height:2;color:var(--text);
  letter-spacing:.01em;
}
.sheet textarea::placeholder{color:var(--text-3)}

/* 底部一条：所有改动一次存 */
.foot{flex:none;display:flex;align-items:center;gap:14px;padding:13px 26px 15px;border-top:1px solid var(--divider);background:var(--surface)}
.state{display:flex;align-items:center;gap:7px;font-size:11.5px;color:var(--text-3)}
.state i{width:6px;height:6px;border-radius:50%;background:var(--outline);display:block}
.state.dirty{color:var(--text-2)}
.state.dirty i{background:var(--accent)}
.state .msg{color:var(--text-3)}
.spacer{flex:1}
.ava img{width:100%;height:100%;object-fit:cover;border-radius:50%;display:block}
</style>
</head>

          <div class="doc-title">它在扮演谁</div>
          <div class="doc-sub">怎么说话、守什么规矩，都在这一段里</div>
        </div>
        <span class="doc-count">126 字</span>
      </div>
      <div class="sheet">
        <textarea spellcheck="false" aria-label="人设正文">你是这个家的总管。谁问你什么，先给结论，再给理由；理由不超过两句。

说话用短句，少形容词。不确定就说不知道，别编；要猜就标出来是猜的。

派活之前先看对方手上有没有活。有就等，别催；没有就直接说清楚要什么。

遇到要动文件、跑命令、花钱的事，先说清要做什么，等主人点头。</textarea>
