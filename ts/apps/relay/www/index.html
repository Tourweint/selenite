<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>镜像控制台 · lifediary relay</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.6 system-ui, "Segoe UI", sans-serif; background: #101014; color: #e6e6ea; display: flex; height: 100vh; }
  aside { width: 280px; border-right: 1px solid #26262e; padding: 16px; overflow: auto; flex-shrink: 0; }
  main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  h1 { font-size: 15px; margin: 0 0 12px; }
  h2 { font-size: 12px; margin: 18px 0 6px; color: #9a9aa6; text-transform: uppercase; letter-spacing: .08em; }
  section { padding: 10px 16px; border-bottom: 1px solid #1c1c22; }
  input, button, select { font: inherit; border-radius: 8px; border: 1px solid #34343e; background: #1a1a20; color: inherit; padding: 6px 10px; }
  button { cursor: pointer; } button:hover { border-color: #5a5a6a; } button:disabled { opacity: .4; cursor: default; }
  .row { display: flex; gap: 8px; margin: 6px 0; } .row input { flex: 1; min-width: 0; }
  .session { padding: 8px 10px; border-radius: 8px; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .session:hover, .session.active { background: #20202a; }
  .session small { color: #8a8a96; margin-left: 6px; }
  .stream { flex: 1; overflow: auto; padding: 16px; }
  .msg { margin: 8px 0; } .msg b { color: #9fc0ff; font-weight: 500; margin-right: 8px; font-size: 12px; }
  .msg .t { font-size: 11px; color: #6a6a76; margin-right: 8px; }
  .approval { border: 1px solid #4a3a20; background: #241d10; border-radius: 10px; padding: 10px 12px; margin: 8px 0; }
  .approval code { display: block; color: #c8a86a; font-size: 12px; white-space: pre-wrap; word-break: break-all; }
  #status { font-size: 12px; color: #8a8a96; }
  #status.ok { color: #7ac07a; }
  .notice { color: #d0a040; font-size: 12px; }
</style>
</head>
<body>
<aside>
  <h1>镜像控制台</h1>
  <div id="status">未连接</div>
  <h2>配对</h2>
  <div class="row"><input id="code" placeholder="6 位加入码" maxlength="6" /></div>
  <div class="row"><button id="pairBtn">配对本控制台</button><button id="forgetBtn" style="display:none">遗忘</button></div>
  <h2>设备</h2>
  <div class="row"><select id="deviceSel" style="flex:1"></select><button id="refreshBtn">刷新</button></div>
  <h2>会话</h2>
  <div class="row"><button id="sessionsBtn">拉会话列表</button></div>
  <div id="sessions"></div>
  <h2>审批待办</h2>
  <div class="row"><button id="approvalsBtn">拉待办</button></div>
  <div id="approvals"><span class="notice">空</span></div>
</aside>
<main>
  <section class="row" style="border-bottom:1px solid #26262e">
    <input id="text" placeholder="对选中会话说话（回车发送）" style="flex:1" />
    <button id="sendBtn">发送</button>
  </section>
  <div class="stream" id="stream"><span class="notice">左侧选一个会话开始镜像</span></div>
</main>
<script src="/app.js"></script>
</body>
</html>
