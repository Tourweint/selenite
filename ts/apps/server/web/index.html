<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Selenite</title>
<link rel="icon" type="image/png" sizes="48x48" href="/assets/favicon.png" />
<link rel="stylesheet" href="/assets/style.css" />
<script>
  // 在样式表应用之前定主题，避免深色用户看到一帧白闪。
  // 四套：paper（米黄）/ white（纯白）/ indigo（靛蓝夜）/ black（纯黑）。
  // 旧值迁移：dark → indigo，light / system / 缺失 → paper（2026-11-05 定稿）。
  (function () {
    var themes = ["paper", "white", "indigo", "black"];
    var stored = localStorage.getItem("lifediary.theme");
    var theme = themes.indexOf(stored) >= 0
      ? stored
      : (stored === "dark" ? "indigo" : "paper");
    if (stored !== theme) localStorage.setItem("lifediary.theme", theme);
    document.documentElement.dataset.theme = theme;
    document.documentElement.dataset.accent = localStorage.getItem("lifediary.accent") || "indigo";
    if (localStorage.getItem("lifediary.sidebar") === "closed") {
      document.documentElement.dataset.sidebar = "closed";
    }
  })();
</script>
</head>
<body>
<!-- 自绘窗口标题栏：全局唯一，横贯侧栏与主区之上。
     空白区可拖动/双击最大化；按钮区必须 no-drag，否则点击会被吞掉。
     窗口三键只在 MyGo 壳里渲染，普通浏览器不显示。 -->
<header class="titlebar" id="titlebar">
  <div class="titlebar-brand">Selenite</div>

  <!-- 顶部 chrome：侧栏开关（仅聊天页显示）+ 功能菜单 -->
  <div class="chrome">
    <button class="icon-btn" id="toggle-sidebar" type="button" aria-label="切换侧栏" title="切换侧栏 (Ctrl+B)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect width="18" height="18" x="3" y="3" rx="2"/>
        <path d="M9 3v18"/>
      </svg>
    </button>

    <div class="menu-wrap">
      <button class="icon-btn" id="menu-btn" type="button" aria-label="功能菜单" aria-haspopup="menu" aria-expanded="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <line x1="4" x2="20" y1="12" y2="12"/>
          <line x1="4" x2="20" y1="6" y2="6"/>
          <line x1="4" x2="20" y1="18" y2="18"/>
        </svg>
      </button>
      <div class="menu-pop" id="menu-pop" role="menu" hidden>
        <button type="button" role="menuitem" data-action="new">新对话</button>
      </div>
    </div>
  </div>

  <div class="titlebar-drag" aria-hidden="true"></div>

  <div class="window-controls" id="window-controls" hidden>
    <button class="window-btn" id="win-min" type="button" aria-label="最小化窗口" title="最小化">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M5 12h14"/>
      </svg>
    </button>
    <button class="window-btn" id="win-max" type="button" aria-label="最大化窗口" title="最大化">
      <svg class="ico-max" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect width="18" height="18" x="3" y="3" rx="2"/>
      </svg>
      <svg class="ico-restore" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" hidden>
        <rect width="14" height="14" x="8" y="8" rx="2" ry="2"/>
        <path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/>
      </svg>
    </button>
    <button class="window-btn close" id="win-close" type="button" aria-label="关闭窗口" title="关闭">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M18 6 6 18"/>
        <path d="m6 6 12 12"/>
      </svg>
    </button>
  </div>
</header>

<div class="app">
  <aside class="sidebar">
    <!-- 收起轨道（2026-11-05 F1 / E4 重排 / E5 对齐 / 2026-11-07 统一批）：
         对齐 CINDY 几何，72px 轨 + 40×40 圆钮。顺序与展开态一致：
         总管（首字圆钮）→ 任务中心 → 项目 → 执事占位（悬停提示去看展开侧栏）→ 群组
         → 底部齿轮 + 状态点。2026-11-07：顶部「新建对话」退役（新建入口在展开态
         「最近会话」分区头的 ＋），状态点改到齿轮正下方，不再挂在右侧。
         项目按钮仍用弹层（72px 放不下内联列表），展开态则是内联分区。 -->
    <div class="side-rail" id="side-rail">
      <button class="rail-btn rail-chief" id="rail-chief" type="button" data-tip="总管" aria-label="总管">
        <span class="pt-avatar" aria-hidden="true">总</span>
      </button>
      <button class="rail-btn" id="rail-tasks" type="button" data-tip="任务中心" aria-label="任务中心">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="8" height="4" x="8" y="2" rx="1" ry="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><path d="M12 11h4"/><path d="M12 16h4"/><path d="M8 11h.01"/><path d="M8 16h.01"/></svg>
      </button>
      <!-- 轨道态项目按钮：点开是「主项目 + 子项目」总览弹层（与展开态 pill 同一份）。 -->
      <button class="rail-btn rail-proj" id="rail-proj" type="button" data-tip="项目"
              aria-label="项目" aria-haspopup="menu" aria-expanded="false" hidden>
        <svg class="proj-rail-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"/>
        </svg>
      </button>
      <div class="rail-sep" aria-hidden="true"></div>
      <!-- 执事占位（E4）：人多了轨道放不下，不在轨道展开；悬停提示去展开侧栏看花名册。
           原「领域负责人」占位移除——领域概览已并入执事区（行点击进任务中心）。 -->
      <button class="rail-btn rail-partners-hint" id="rail-partners" type="button" title="执事（展开侧栏查看）" data-tip="执事（展开侧栏查看）" aria-label="执事">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
      </button>
      <button class="rail-btn" id="rail-groups" type="button" title="群组" data-tip="群组" aria-label="群组" disabled>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"/><path d="M8 12h.01"/><path d="M12 12h.01"/><path d="M16 12h.01"/></svg>
      </button>
      <!-- 长期课题（2026-11-07 批二）：轨道上只做「展开侧栏」的提示入口，
           列表与时间线都在展开态的分区里（与执事占位同一思路）。 -->
      <button class="rail-btn" id="rail-topics" type="button" title="课题（展开侧栏查看）" data-tip="课题（展开侧栏查看）" aria-label="课题">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m10.065 12.493-6.18 1.318a.934.934 0 0 1-1.108-.702l-.537-2.15a1.07 1.07 0 0 1 .691-1.265l13.504-4.44"/><path d="m13.56 11.747 4.332-.924"/><path d="m16 21-3.105-6.21"/><path d="M16.485 5.94a2 2 0 0 1 1.455-2.425l1.09-.272a1 1 0 0 1 1.212.727l1.515 6.06a1 1 0 0 1-.727 1.213l-1.09.272a2 2 0 0 1-2.425-1.455z"/><path d="m6.158 8.633 1.114 4.456"/><path d="m8 21 3.105-6.21"/><circle cx="12" cy="13" r="2"/></svg>
      </button>
      <div class="rail-flex" aria-hidden="true"></div>
      <!-- 收起态底部（2026-11-07）：齿轮在上、状态点在正下方，同一竖轴。
           之前状态点绝对定位在右侧，跟齿轮不在一条线上，收起态看着别扭。 -->
      <div class="rail-foot">
        <button class="rail-btn" id="rail-settings" type="button" data-tip="设置" aria-label="设置" title="设置">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/>
            <circle cx="12" cy="12" r="3"/>
          </svg>
        </button>
        <div class="rail-status" id="rail-status" data-state="waiting" aria-hidden="true"><i></i></div>
      </div>
    </div>

    <div class="sidebar-inner" id="sidebar-inner">
      <!-- 总管（2026-11-07）：固定条目，不进折叠区，永在最上。
           点头像 = 进编辑；点行其余部分 = 打开总管会话（历史里最近一条，没有就新开）。 -->
      <div class="side-item chief-entry" id="chief-entry" role="button" tabindex="0"
           aria-label="总管" title="总管">
        <button class="pt-avatar avatar-edit" id="chief-avatar" type="button"
                aria-label="编辑总管头像" title="编辑总管头像">总</button>
        <span class="roster-name">总管</span>
        <span class="pill-tag">总管</span>
        <span class="side-count chief-count" id="chief-count" hidden></span>
        <i class="status-dot idle" id="chief-dot" aria-hidden="true"></i>
      </div>

      <!-- 分区形态（2026-11-07 四改，用户口径）：
           **不要箭头**——点整行（图标 + 名称）就是收起/展开；行尾只留一个 ＋。
           展开/收起的状态用整行的 hover 底 + 名称颜色表达，不再靠箭头。
           顺序按用户要求：执事在上（紧跟总管），然后是会话/任务、项目、群组。 -->

      <!-- 执事（上移到总管之后） -->
      <section class="side-sec is-open" id="sec-partners" data-sec="partners">
        <button class="side-sec-head" id="sec-partners-toggle" type="button" aria-expanded="true"
                aria-controls="sec-partners-body" title="执事（点一下收起/展开）">
          <svg class="sec-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
          <span class="sec-name">执事</span>
          <span class="side-count sec-count" id="partners-badge" hidden></span>
        </button>
        <button class="sec-add" id="partner-add-side" type="button" aria-label="新建执事" title="新建执事">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="M12 5v14"/></svg>
        </button>
        <div class="side-sec-body" id="sec-partners-body">
          <div class="side-sec-clip">
            <div class="side-sec-inner">
              <div class="roster" id="partner-roster" aria-label="执事花名册"></div>
              </div>
          </div>
        </div>
      </section>

      <!-- 会话 / 任务中心合并（2026-11-07 四改）：两块的实效一样——都是"有哪些对话"。
           现在一个分区、一个 ＋（新建一条普通对话），列表里同时显示两类行：
             会话行    = 普通对话，点进对话；
             任务行    = 有派活的对话，带聚合灯，点进任务中心那张卡。
           会话行在前（最近聊的），任务行殿后（有活的），中间不加分隔条。 -->
      <section class="side-sec is-open" id="sec-chats" data-sec="chats">
        <button class="side-sec-head" id="sec-chats-toggle" type="button" aria-expanded="true"
                aria-controls="sec-chats-body" title="对话（点一下收起/展开）">
          <svg class="sec-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
          <span class="sec-name">对话</span>
          <span class="side-count sec-count" id="tasks-badge" hidden></span>
        </button>
        <button class="sec-add" id="sec-chats-add" type="button" aria-label="新建对话" title="新建对话 (Ctrl+K)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="M12 5v14"/></svg>
        </button>
        <div class="side-sec-body" id="sec-chats-body">
          <div class="side-sec-clip">
            <div class="side-sec-inner">
              <nav class="chats" id="chats" aria-label="对话"></nav>
              <div class="roster" id="tasks-mini" aria-label="任务对话"></div>
              <button class="sec-foot-link" id="sec-tasks-all" type="button">打开任务中心 <span aria-hidden="true">→</span></button>
              </div>
          </div>
        </div>
      </section>

      <!-- 项目：行尾 ＋ 给两个入口（新建项目 / 添加已有子项目）。 -->
      <section class="side-sec is-open" id="sec-projects" data-sec="projects">
        <button class="side-sec-head" id="sec-projects-toggle" type="button" aria-expanded="true"
                aria-controls="sec-projects-body" title="项目（点一下收起/展开）">
          <svg class="sec-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"/></svg>
          <span class="sec-name" id="sec-projects-name">项目</span>
        </button>
        <div class="sec-add-wrap">
          <button class="sec-add" id="sec-projects-add" type="button"
                  aria-haspopup="menu" aria-expanded="false" aria-label="新建项目" title="新建项目 / 添加子项目">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="M12 5v14"/></svg>
          </button>
        </div>
        <div class="side-sec-body" id="sec-projects-body">
          <div class="side-sec-clip">
            <div class="side-sec-inner">
              <div class="roster" id="proj-list" aria-label="项目列表"></div>
              <button class="sec-foot-link" id="sec-projects-manage" type="button">管理项目 → 设置</button>
              </div>
          </div>
        </div>
      </section>

      <section class="side-sec is-open" id="sec-groups" data-sec="groups">
        <button class="side-sec-head" id="sec-groups-toggle" type="button" aria-expanded="true"
                aria-controls="sec-groups-body" title="群组（点一下收起/展开）" disabled>
          <svg class="sec-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"/><path d="M8 12h.01"/><path d="M12 12h.01"/><path d="M16 12h.01"/></svg>
          <span class="sec-name">群组</span>
        </button>
        <button class="sec-add" id="sec-groups-add" type="button" aria-label="新建群组" title="新建群组" disabled>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="M12 5v14"/></svg>
        </button>
        <div class="side-sec-body" id="sec-groups-body">
          <div class="side-sec-clip">
            <div class="side-sec-inner">
              <div class="roster" id="group-list" aria-label="群组列表"></div>
              <!-- 所有群聊（2026-11-07）：与任务中心/项目管理同一条「分区底部去整页看」的链接行。
                   以前只有群会话顶栏的返回键能到群列表，用户口径是「别放在返回之后」——
                   展开着群组就能直接进列表，群会话里也不必先返回再找。 -->
              <button class="sec-foot-link" id="sec-groups-all" type="button">所有群聊 <span aria-hidden="true">→</span></button>
              </div>
          </div>
        </div>
      </section>

      <!-- 长期课题（2026-11-07 批二）：与执事 / 群组同一套分区外壳。
           列表 = 进行中课题（题目 + 口味 + 下次研究）；点开一行在行内展开时间线与操作，
           不改页面路由。空态一句话（见 app.js）。 -->
      <section class="side-sec is-open" id="sec-topics" data-sec="topics">
        <button class="side-sec-head" id="sec-topics-toggle" type="button" aria-expanded="true"
                aria-controls="sec-topics-body" title="课题（点一下收起/展开）">
          <svg class="sec-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m10.065 12.493-6.18 1.318a.934.934 0 0 1-1.108-.702l-.537-2.15a1.07 1.07 0 0 1 .691-1.265l13.504-4.44"/><path d="m13.56 11.747 4.332-.924"/><path d="m16 21-3.105-6.21"/><path d="M16.485 5.94a2 2 0 0 1 1.455-2.425l1.09-.272a1 1 0 0 1 1.212.727l1.515 6.06a1 1 0 0 1-.727 1.213l-1.09.272a2 2 0 0 1-2.425-1.455z"/><path d="m6.158 8.633 1.114 4.456"/><path d="m8 21 3.105-6.21"/><circle cx="12" cy="13" r="2"/></svg>
          <span class="sec-name">课题</span>
          <span class="side-count sec-count" id="topics-badge" hidden></span>
        </button>
        <div class="side-sec-body" id="sec-topics-body">
          <div class="side-sec-clip">
            <div class="side-sec-inner">
              <div class="roster topic-roster" id="topic-list" aria-label="课题列表"></div>
            </div>
          </div>
        </div>
      </section>

      <!-- 底部（2026-11-07 二改）：与收起轨道完全同构——齿轮一颗居中，状态点正下方居中。
           之前这里是「设置」整行文字 + 状态「点 + 连接中」一行文字，展开态看着像左右两列；
           用户口径：设置不用文字，图标就行；状态也只要点，别占一行。 -->
      <div class="side-foot">
        <button class="side-item foot-gear" id="open-settings" type="button" aria-label="设置" title="设置">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/>
            <circle cx="12" cy="12" r="3"/>
          </svg>
        </button>
        <span class="status" id="status" data-state="waiting" role="status" aria-live="polite">
          <i aria-hidden="true"></i><span class="status-text" id="status-text">连接中</span>
        </span>
      </div>
    </div>
  </aside>

  <main class="main" id="view-chat">
    <header class="top">
      <h1 id="title">新对话</h1>
      <!-- 对话现场快捷设置（2026-11-07 抽屉改造）：右上角图标按钮，点击从右侧滑入全高抽屉
           （首页四行 + 各二级页，见 app.js 渲染）。与 composer 模型 pill 共用同一套数据与渲染。 -->
      <div class="top-wrap">
        <button class="top-gear" id="chat-settings-btn" type="button" aria-expanded="false"
                aria-label="对话设置" title="对话设置">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M20 7h-9"/>
            <path d="M14 17H5"/>
            <circle cx="17" cy="17" r="3"/>
            <circle cx="7" cy="7" r="3"/>
          </svg>
        </button>
      </div>
    </header>

    <div class="scroll" id="scroll">
      <div class="thread" id="thread">
        <div class="empty" id="empty">
          <!-- 首页标识（2026-11-07 改横排）：项目水晶与问候语左右并置，像一枚印在纸上的题头。
               水晶无背景框，光晕由 CSS 滤镜给。 -->
          <img class="empty-mark" src="/assets/crystal-mark.png" alt="" aria-hidden="true">
          <p class="empty-greet" id="empty-greet">说吧，我在。</p>
        </div>
      </div>
    </div>

    <!-- 输入框是一个容器卡（2026-11-04 对齐 cindy ComposerCard）：
         边框/卡底在容器上，textarea 透明无框；底部工具行左：附件占位，
         右：模型 + 上下文环 + 发送（模型紧挨发送，CINDY / ZCode 同款，D2 挪的）。
         思考强度收进模型菜单，挂在当前模型名下方一行。流式时发送同槽换成停止，没有第二个停止入口。 -->
    <form class="composer" id="composer" autocomplete="off">
      <textarea id="input" rows="1" placeholder="说点什么…" aria-label="输入消息"></textarea>
      <div class="composer-foot">
        <div class="composer-tools">
          <!-- 附件占位（2026-11-04）：只弹 toast，不上传、不发请求 -->
          <button class="composer-add" id="composer-add" type="button"
                  aria-label="添加附件（未接入）" title="添加附件（未接入）">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="M12 5v14"/></svg>
          </button>
        </div>

        <div class="composer-meta">
          <!-- 模型快捷切换（2026-11-04 批次五）：每次打开现拉，一次只看一家供应商。
               2026-11-04 界面 v2：思考强度并入每行（原来独立的思考档 pill 已删）。
               D2：pill 挪进右组，菜单仍由包裹层定位（贴着 pill 右上角往上弹）。 -->
          <div class="composer-wrap">
            <button class="composer-pill model-pill" id="model-pill" type="button" aria-haspopup="menu" aria-expanded="false"
                    title="切换模型（下一轮生效）">
              <span id="model-pill-label">模型</span>
              <span class="model-think" id="model-think" hidden></span>
              <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
            </button>
            <div class="model-menu composer-pop" id="model-menu" role="menu" hidden></div>
          </div>

          <!-- 上下文环（2026-11-04 从顶栏搬进 composer 右下）：20×20 进度环 + 百分比 -->
          <span class="ctx-ring" id="ctx-ring" hidden>
            <svg viewBox="0 0 20 20" aria-hidden="true">
              <circle class="ctx-track" cx="10" cy="10" r="8.25"/>
              <circle class="ctx-fill" id="ctx-fill" cx="10" cy="10" r="8.25"/>
            </svg>
            <span class="ctx-pct" id="ctx-pct"></span>
          </span>
          <button class="send" id="send" type="submit" aria-label="发送" disabled>
            <svg class="ico-send" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 7-7 7 7"/><path d="M12 19V5"/></svg>
            <!-- 停止方块按 CINDY SendButton 规格：10×10 圆角 1.5（24 视框里 rect 9x9 @ 7.5,7.5）
                 —— 官方 square 占视框 75% 太大，发送钮里它就该是小小一枚 -->
            <svg class="ico-stop" viewBox="0 0 24 24" aria-hidden="true"><rect width="9" height="9" x="7.5" y="7.5" rx="1.5" fill="currentColor"/></svg>
          </button>
        </div>
      </div>
    </form>
  </main>

  <!-- 设置页（2026-11-03 对齐 cindy 的分层结构）：
       左栏是「返回行 + 分区导航」，右列是滚动内容区，一次只渲染当前分区。
       导航切换走 hash 子路由（#/settings/外观），浏览器前进后退可用。 -->
  <main class="main settings" id="view-settings" hidden>
    <aside class="set-side">
      <div class="set-head">
        <button class="set-back" id="close-settings" type="button" aria-label="返回" title="返回 (Esc)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="m12 19-7-7 7-7"/>
            <path d="M19 12H5"/>
          </svg>
        </button>
        <h1>设置</h1>
      </div>
      <nav class="set-nav" id="settings-nav" aria-label="设置分区"></nav>
    </aside>
    <div class="set-scroll" id="settings-scroll">
      <div class="set-page" id="settings-inner"></div>
    </div>
  </main>

  <!-- 任务中心（2026-11-04）：独立整页，与设置同级；侧栏保留，入口在侧栏底部
       与收起轨道里。只读：不做改派、不做手动停止。
       详情走 hash 子路由 #/tasks?ticket=<id>，浏览器后退可用。 -->
  <main class="main tasks" id="view-tasks" hidden>
    <header class="tasks-top">
      <div class="tasks-title">
        <button class="set-back" id="tasks-back" type="button" aria-label="返回任务看板" title="返回任务看板 (Esc)" hidden>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="m12 19-7-7 7-7"/>
            <path d="M19 12H5"/>
          </svg>
        </button>
        <h1>
          <span id="tasks-title-text">任务中心</span>
          <span class="tasks-title-sub" id="tasks-title-sub"></span>
        </h1>
      </div>
      <div class="tasks-actions">
        <div class="tasks-filters" id="tasks-filters">
          <select class="tasks-select" id="tasks-domain" aria-label="按领域筛选">
            <option value="">全部领域</option>
          </select>
          <select class="tasks-select" id="tasks-project" aria-label="按项目筛选">
            <option value="">全部项目</option>
          </select>
          <select class="tasks-select" id="tasks-sort" aria-label="排序">
            <option value="recent">最近更新</option>
            <option value="status">按状态</option>
          </select>
        </div>
        <button class="ghost" id="tasks-refresh" type="button">刷新</button>
      </div>
    </header>
    <div class="tasks-scroll" id="tasks-scroll">
      <div class="tasks-state" id="tasks-state" hidden></div>
      <div class="tasks-body" id="tasks-body">
        <!-- 外部打手区（L3）：按执行者聚合的四张小卡，点一下过滤主视图；
             数据全部来自 tickets 列表的 employee 字段，不新增接口 -->
        <div class="tk-hitters" id="tasks-hitters" hidden></div>
        <div class="tasks-stats" id="tasks-stats"></div>
        <!-- 三列喂的是对话卡的聚合灯：待你处理 / 出错 / 进行中 -->
        <div class="tasks-board" id="tasks-board"></div>
        <!-- 已完结折叠区（K1/L3）：全 done 的对话卡，放在看板网格外，窄屏不必横滚 -->
        <div class="tk-archive" id="tasks-archive" hidden></div>
        <!-- 「更早的直派」（L3）：没有 conversationId 的旧单，沿用折叠样式摆最下面 -->
        <div class="tk-archive" id="tasks-direct" hidden></div>
        <div class="task-detail" id="task-detail" hidden></div>
      </div>
    </div>
  </main>

  <!-- 领域概览（E2 #3，E4 保留）：独立页 #/domains 路由与视图原样保留，仅移除侧栏
       「领域负责人」占位——领域概览已并入执事花名册（行点击/单数进任务中心）。
       只读：GET /api/v1/domains，每行 领域 · 活跃单数 · 状态；error 行标红 + 错误文案。
       行点击跳 #/tasks?domain=<domain>（任务中心的 domain 筛选，任务中心里仍有入口）。 -->
  <main class="main tasks" id="view-domains" hidden>
    <header class="tasks-top">
      <div class="tasks-title">
        <button class="set-back" id="domains-back" type="button" aria-label="返回对话" title="返回对话 (Esc)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="m12 19-7-7 7-7"/>
            <path d="M19 12H5"/>
          </svg>
        </button>
        <h1>领域负责人<span class="tasks-title-sub" id="domains-title-sub"></span></h1>
      </div>
      <div class="tasks-actions">
        <button class="ghost" id="domains-refresh" type="button">刷新</button>
      </div>
    </header>
    <div class="tasks-scroll" id="domains-scroll">
      <div class="tasks-state" id="domains-state" hidden></div>
      <div class="tasks-body" id="domains-body"></div>
    </div>
  </main>

  <!-- 群组（2026-11-06 群组方案批二）：#/groups 列表 + #/group/:id 会话视图共用一个容器。
       时间线四形态（主人右/成员左/系统行居中/同作者合并）见 style.css 群组段。 -->
  <main class="main tasks" id="view-groups" hidden>
    <header class="tasks-top">
      <div class="tasks-title">
        <!-- 返回键文案按实际行为写（2026-11-07 修）：它的落点一直是「群会话 → 群列表、
             列表 → 对话页」（见 groupsBack 的接线），原来 aria-label/title 写的是
             「返回对话 (Esc)」——两个承诺都不对：没回对话，Esc 也没绑。 -->
        <button class="set-back" id="groups-back" type="button" aria-label="返回" title="返回">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="m12 19-7-7 7-7"/>
            <path d="M19 12H5"/>
          </svg>
        </button>
        <h1><span id="groups-title-text">群组</span><span class="tasks-title-sub" id="groups-title-sub"></span></h1>
      </div>
      <div class="tasks-actions">
        <!-- 群设置（2026-11-07）：纯图标入口，与右上角对话设置同款（.top-gear 几何）。
             文字按钮在群会话顶栏里比标题还抢眼，图标 + title/aria-label 才是正解。 -->
        <button class="top-gear" id="group-settings-btn" type="button" aria-label="群设置" title="群设置" hidden>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M20 7h-9"/>
            <path d="M14 17H5"/>
            <circle cx="17" cy="17" r="3"/>
            <circle cx="7" cy="7" r="3"/>
          </svg>
        </button>
        <button class="btn-primary" id="group-create" type="button">新建群组</button>
      </div>
    </header>
    <div class="tasks-scroll" id="groups-scroll">
      <div class="tasks-state" id="groups-state" hidden></div>
      <!-- 列表态 -->
      <div class="tasks-body" id="groups-body"></div>
      <!-- 会话态：时间线 + composer（复用主对话 composer 的样式骨架，独立一份 DOM） -->
      <div class="group-chat" id="group-chat" hidden>
        <!-- 成员条（2026-11-07）：谁在群里一眼看见；点头像=把 @名字 插进输入框，
             右键=同一份菜单（@他 / 复制名字）。@ 的发现性靠这条 + 输入框左侧 @ 按钮。 -->
        <div class="group-members" id="group-members" role="group" aria-label="群成员"></div>
        <div class="group-notice" id="group-notice" hidden></div>
        <div class="group-thread" id="group-thread"></div>
        <div class="group-composer">
          <div class="group-atpop" id="group-atpop" role="listbox" aria-label="点名候选" hidden></div>
          <button class="group-at-btn" id="group-at-btn" type="button" aria-label="点名（@）" title="点名 @">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <circle cx="12" cy="12" r="4"/>
              <path d="M16 8v5a3 3 0 0 0 6 0v-1a10 10 0 1 0-4 8"/>
            </svg>
          </button>
          <textarea class="group-input" id="group-input" rows="1"
                    placeholder="@点名、@所有人，或不 @ 发给值日执事…"></textarea>
          <button class="group-send" id="group-send" type="button" aria-label="发送" disabled>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 14 0"/><path d="m13 6 6 6-6 6"/></svg>
          </button>
          <button class="group-send group-stop" id="group-stop" type="button" aria-label="停止" hidden>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>
          </button>
        </div>
      </div>
    </div>
  </main>
</div>

<!-- 项目切换弹层（2026-11-04）：展开态 pill 与收起轨道按钮共用这一份。
     放在 body 下而不是 .sidebar 里：侧栏收起动画要靠 overflow:hidden 裁内容，
     弹层放进去会被一起裁掉。位置由 JS 按触发元素实测写入，动效沿用 .composer-pop。 -->
<div class="proj-pop composer-pop" id="proj-menu" role="menu" aria-label="项目" hidden></div>

<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<!-- 轨道 tooltip（2026-11-05 F1）：挂在 body 下，避免被 .sidebar 的 overflow:hidden 裁掉。 -->
<div class="rail-tip" id="rail-tip" role="tooltip" hidden></div>

<!-- 通用模态弹窗（2026-11-05 F1，ZCode 规格）：纯手写，与 composer morph 弹层并存。
     内容由 openModal(title, bodyBuilder) 每次重建；Esc / 点遮罩 / 右上 X 关闭。 -->
<div class="modal" id="modal" hidden>
  <div class="modal-mask" id="modal-mask"></div>
  <div class="modal-panel" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="modal-head">
      <h2 class="modal-title" id="modal-title"></h2>
      <button class="modal-x" id="modal-close" type="button" aria-label="关闭" title="关闭 (Esc)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M18 6 6 18"/>
          <path d="m6 6 12 12"/>
        </svg>
      </button>
    </div>
    <div class="modal-body" id="modal-body"></div>
  </div>
</div>

<div id="chat-settings-overlay" class="side-overlay" hidden></div>
<aside id="chat-settings-drawer" class="side-drawer" role="dialog" aria-modal="true" aria-label="对话设置" hidden></aside>

<!-- 群设置（2026-11-07）：与对话设置同一个抽屉骨架（.side-drawer / .side-overlay），
     首页是群身份 + 设置行，二级页管改名/公告/应答口径/值日/成员，删除在页尾。
     原先的居中弹窗（modal）在这个信息量下太挤：一屏塞满输入框与勾选胶囊，看不出层级。 -->
<div id="group-settings-overlay" class="side-overlay" hidden></div>
<aside id="group-settings-drawer" class="side-drawer" role="dialog" aria-modal="true" aria-label="群设置" hidden></aside>

<div class="gate" id="gate" hidden>
  <form class="gate-box" id="gate-form">
    <h2>需要访问令牌</h2>
    <p>当前页面不是从本机打开的。令牌就是你启动服务时设置的 <code>AGENT_TOKEN</code> 环境变量；本机打开不需要它。</p>
    <input id="gate-input" type="password" placeholder="AGENT_TOKEN" autocomplete="off" spellcheck="false" required />
    <div class="gate-row">
      <button type="submit">保存并继续</button>
    </div>
    <p class="gate-err" id="gate-err" hidden></p>
  </form>
</div>

<script type="module" src="/assets/app.js"></script>
</body>
</html>
