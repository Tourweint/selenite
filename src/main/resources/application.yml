server:
  port: ${PORT:8081}
spring:
  application:
    name: lifediary-harness
app:
  jwt:
    # 与 backend 同源注入的 HS256 签名密钥（D2）：两端一致且同时更换；未配置 = 所有请求 403（fail-closed）
    secret: ${JWT_SECRET:}
  signal:
    # TypeSafe Jev 上游（路径 B）：key 与出口代理**只走环境变量**（密钥绝不入库/绝不下发）
    jev-enabled: ${SIGNAL_JEV_ENABLED:true}
    typesafe-key: ${TYPESAFE_API_KEY:}
    typesafe-url: ${TYPESAFE_URL:https://api.typesafe.ai/v1/systemone}
    typesafe-model: ${TYPESAFE_MODEL:jev-latest}
    # 出口代理（Jev 区域封锁 451 的解法）：socks5://127.0.0.1:10808 或 http://host:port；留空直连
    typesafe-proxy: ${TYPESAFE_PROXY:}
  backend:
    # backend 内部接口基址（同机/同 VPC 部署，接口文档 §9）；internal-token 与 backend 的 INTERNAL_TOKEN 同值
    internal-base-url: ${BACKEND_INTERNAL_URL:http://127.0.0.1:8080}
    internal-token: ${INTERNAL_TOKEN:}
  llm:
    # 上游 OpenAI 兼容端点与**本服务持有的 key**（P2 起由 harness 持有；key 只走环境变量，绝不入库/绝不下发）
    base-url: ${LLM_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
    api-key: ${LLM_API_KEY:}
    # 模型调优归服务端（2026-10-21 口径随迁）：非空时转发前覆盖请求体 model 字段；留空 = 原样透传
    model: ${LLM_MODEL:}
  rate-limit:
    # 自带防滥用闸门（不得裸奔）：信号评估按来源 IP 的频次 + 并发
    enabled: ${RATE_LIMIT_ENABLED:true}
    signal-per-minute: ${RATE_LIMIT_SIGNAL_PER_MINUTE:30}
    max-concurrent: ${RATE_LIMIT_MAX_CONCURRENT:4}
